name: Run Tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.java'
  pull_request:
    branches: [main]
    paths:
      - '**/*.java'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and run Java tests
        run: |
          echo "?? Finding Java files with tests..."
          echo ""
          
          passed=0
          failed=0
          files_checked=0
          
          # Find all Java files in pattern folders
          for folder in two-pointers sliding-window fast-slow-pointers merge-intervals \
                        cyclic-sort inplace-linked-list-reversal bfs dfs-backtracking \
                        two-heaps subsets-backtracking binary-search top-k-heap \
                        k-way-merge dp-1d dp-2d greedy topological-sort \
                        trie union-find monotonic-stack; do
            if [ -d "$folder" ]; then
              for file in "$folder"/*.java; do
                if [ -f "$file" ]; then
                  files_checked=$((files_checked + 1))
                  echo "????????????????????????????????????????????????"
                  echo "?? Testing: $file"
                  echo "????????????????????????????????????????????????"
                  
                  # Try to compile the Java file
                  if javac "$file" 2>&1; then
                    # Check if file has main method
                    if grep -q "public static void main" "$file"; then
                      classname=$(basename "${file%.java}")
                      echo "  ▶ Running main method..."
                      if timeout 10 java -cp "$folder" "$classname" 2>&1; then
                        echo "? PASS: $file"
                        passed=$((passed + 1))
                      else
                        echo "? FAIL: $file (runtime error or timeout)"
                        failed=$((failed + 1))
                      fi
                    else
                      echo "? COMPILE OK: $file (no main method)"
                      passed=$((passed + 1))
                    fi
                    # Clean up .class files
                    rm -f "${file%.java}.class"
                  else
                    echo "? COMPILE ERROR: $file"
                    failed=$((failed + 1))
                  fi
                  echo ""
                fi
              done
            fi
          done
          
          echo "????????????????????????????????????????????????"
          echo "?? SUMMARY"
          echo "????????????????????????????????????????????????"
          echo "Files checked: $files_checked"
          echo "Passed: $passed"
          echo "Failed: $failed"
          echo ""
          
          if [ $failed -gt 0 ]; then
            echo "? Some tests failed!"
            exit 1
          else
            echo "? All tests passed!"
          fi

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `## ?? Test Results
            
            All Java files compiled successfully! ?
            
            Checked at: ${new Date().toISOString()}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
